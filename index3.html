<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR.js с GPS координатами и выводом координат</title>
    <!-- Подключаем A-Frame и AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 999;
        }
        #gps-coordinates {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        #gps-coordinates .label {
            color: #aaa;
            margin-right: 5px;
        }
        .coordinate-value {
            font-weight: bold;
        }
        .warning {
            color: #ffaa00;
        }
    </style>
</head>
<body>
    <div id="info">
        🔵 Куб – 10 м на север<br>
        🔴 Сфера – 10 м на восток<br>
        🟢 Цилиндр – 15 м на юго-запад
    </div>

    <div id="gps-coordinates">
        <span class="label">📍 Широта:</span> <span id="lat" class="coordinate-value">--</span><br>
        <span class="label">📍 Долгота:</span> <span id="lng" class="coordinate-value">--</span><br>
        <span class="label">🕒 Последнее обновление:</span> <span id="timestamp" class="coordinate-value">--</span>
    </div>

    <!-- AR-сцена -->
    <a-scene id="scene" embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">
        <!-- Камера с поддержкой GPS -->
        <a-camera id="camera" gps-camera="gpsMinDistance: 1;"></a-camera>

        <!-- Объекты, размещённые относительно текущей позиции пользователя -->
        <!-- Куб в 10 метрах к северу (heading = 0°) -->
        <a-box
            material="color: cyan; transparent: false;"
            gps-projected-entity="distance: 10; heading: 0;"
            scale="1 1 1"
            position="0 0 -5">
        </a-box>

        <!-- Сфера в 10 метрах к востоку (heading = 90°) -->
        <a-sphere
            material="color: red;"
            gps-projected-entity="distance: 10; heading: 90;"
            radius="0.5"
            position="0 1 -5">
        </a-sphere>

        <!-- Дополнительный объект – цилиндр на юго-запад (225°) -->
        <a-cylinder
            material="color: green;"
            gps-projected-entity="distance: 15; heading: 225;"
            radius="0.5"
            height="1.5"
            position="0 0.75 -5">
        </a-cylinder>
    </a-scene>

    <script>
        (function() {
            // Функция для форматирования времени
            function formatTime(date) {
                return date.toLocaleTimeString() + '.' + date.getMilliseconds();
            }

            // Получаем элементы для вывода координат
            const latEl = document.getElementById('lat');
            const lngEl = document.getElementById('lng');
            const timestampEl = document.getElementById('timestamp');

            // Функция обновления координат на экране
            function updateCoordinates(position) {
                if (position) {
                    latEl.textContent = position.latitude.toFixed(6);
                    lngEl.textContent = position.longitude.toFixed(6);
                    timestampEl.textContent = formatTime(new Date());
                } else {
                    latEl.textContent = '--';
                    lngEl.textContent = '--';
                    timestampEl.innerHTML = '<span class="warning">ожидание GPS...</span>';
                }
            }

            // Ждём загрузки сцены и получения доступа к камере
            document.querySelector('a-scene').addEventListener('loaded', function () {
                const cameraEl = document.getElementById('camera');

                // Если координаты уже доступны (например, из предыдущей сессии), покажем их
                if (cameraEl.components && cameraEl.components['gps-camera']) {
                    const currentPos = cameraEl.components['gps-camera'].currentPosition;
                    if (currentPos) {
                        updateCoordinates(currentPos);
                    } else {
                        updateCoordinates(null);
                    }
                } else {
                    updateCoordinates(null);
                }

                // Слушаем событие обновления GPS-позиции
                cameraEl.addEventListener('gps-camera-update', function(evt) {
                    // В evt.detail содержится { position: { latitude, longitude, altitude } }
                    if (evt.detail && evt.detail.position) {
                        updateCoordinates(evt.detail.position);
                    }
                });

                // Также можно обработать ошибку, если она возникнет
                cameraEl.addEventListener('gps-camera-error', function(evt) {
                    console.warn('GPS ошибка:', evt.detail);
                    latEl.textContent = 'ошибка';
                    lngEl.textContent = 'ошибка';
                    timestampEl.innerHTML = '<span class="warning">ошибка GPS</span>';
                });
            });
        })();
    </script>
</body>
</html>
