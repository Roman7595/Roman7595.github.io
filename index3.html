<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR.js с GPS координатами</title>
    <!-- Подключаем A-Frame и AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="info">
        🔵 Куб – 1 м на север<br>
        🔴 Сфера – 1 м на восток
    </div>

    <!-- AR-сцена -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">
        <!-- Камера с поддержкой GPS -->
        <a-camera gps-camera="gpsMinDistance: 1;"></a-camera>

        <!-- Объекты, размещённые относительно текущей позиции пользователя -->
        <!-- Куб в 10 метрах к северу (heading = 0°) -->
        <a-box
            material="color: cyan; transparent: false;"
            gps-projected-entity="distance: 10; heading: 0;"
            scale="1 1 1"
            position="0 0 -5">   <!-- Смещение по вертикали и вперёд для удобства просмотра -->
        </a-box>

        <!-- Сфера в 10 метрах к востоку (heading = 90°) -->
        <a-sphere
            material="color: red;"
            gps-projected-entity="distance: 1; heading: 90;"
            radius="0.5"
            position="0 1 -5">
        </a-sphere>

        <!-- Дополнительный объект – цилиндр на юго-запад (225°) -->
        <a-cylinder
            material="color: green;"
            gps-projected-entity="distance: 1; heading: 225;"
            radius="0.5"
            height="1.5"
            position="0 0.75 -5">
        </a-cylinder>
    </a-scene>
</body>
</html>
