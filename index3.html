<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR.js с GPS координатами и выводом координат</title>
    <!-- Подключаем A-Frame и AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/arjs@3.4.1/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 999;
        }
        #gps-coordinates {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        #gps-coordinates .label {
            color: #aaa;
            margin-right: 5px;
        }
        .coordinate-value {
            font-weight: bold;
        }
        .warning {
            color: #ffaa00;
        }
    </style>
</head>
<body>
    <div id="info">
         Куб – 1 м на север<br>
         Сфера – 2 м на восток<br>
         Цилиндр – 3 м на юго-запад<br>
         абобАaaaAa
    </div>

    <div id="gps-coordinates">
        <span class="label"> Широта:</span> <span id="lat" class="coordinate-value">--</span><br>
        <span class="label"> Долгота:</span> <span id="lng" class="coordinate-value">--</span><br>
        <span class="label"> Последнее обновление:</span> <span id="timestamp" class="coordinate-value">--</span>
    </div>

    <!-- AR-сцена -->
    <a-scene id="scene" embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">
        <!-- Камера с поддержкой GPS -->
        <a-camera id="camera" gps-camera="gpsMinDistance:0.01;"></a-camera>

        <!-- Объекты, размещённые относительно текущей позиции пользователя -->
        <!-- Куб в 10 метрах к северу (heading = 0°) -->
        <a-box
            material="color: cyan; transparent: false;"
            scale="1 1 1"
            gps-new-entity-place="latitude: 55.812314; longitude: 37.810617"
            position="0 0 -5">
        </a-box>

        <a-sphere
            material="color: red;"
            gps-new-entity-place="latitude: 55.812313; longitude: 37.810618"
            radius="0.5"
            >
        </a-sphere>

        <!-- Дополнительный объект – цилиндр на юго-запад (225°) -->
        <!-- <a-cylinder
            material="color: green;"
            gps-projected-entity="distance: 3; heading: 225;"
            radius="0.5"
            height="1.5"
            position="0 0.75 -6">
        </a-cylinder> -->
    </a-scene>

    <script>
        (function() {
            const latEl = document.getElementById('lat');
            const lngEl = document.getElementById('lng');
            const timestampEl = document.getElementById('timestamp');

            function formatTime(date) {
                return date.toLocaleTimeString() + '.' + String(date.getMilliseconds()).padStart(3, '0');
            }

            // Функция обновления интерфейса из объекта позиции
            function updateDisplay(position) {
                if (position && typeof position.latitude === 'number' && typeof position.longitude === 'number') {
                    latEl.textContent = position.latitude.toFixed(6);
                    lngEl.textContent = position.longitude.toFixed(6);
                    timestampEl.textContent = formatTime(new Date());
                } else {
                    latEl.textContent = '--';
                    lngEl.textContent = '--';
                    timestampEl.innerHTML = '<span class="warning">ожидание GPS...</span>';
                }
            }

            // Ждём загрузки сцены
            document.querySelector('a-scene').addEventListener('loaded', function() {
                const camera = document.getElementById('camera');

                // Подписываемся на событие обновления GPS от AR.js
                camera.addEventListener('gps-camera-update', function(evt) {
                    // Координаты приходят в evt.detail.position
                    if (evt.detail && evt.detail.position) {
                        updateDisplay(evt.detail.position);
                    }
                });

                camera.addEventListener('gps-camera-error', function(evt) {
                    console.warn('Ошибка GPS:', evt.detail);
                    latEl.textContent = 'ошибка';
                    lngEl.textContent = 'ошибка';
                    timestampEl.innerHTML = '<span class="warning">ошибка GPS</span>';
                });

                // Резервное чтение из компонента (если событие не сработало, но координаты уже есть)
                setTimeout(() => {
                    const gpsComp = camera.components && camera.components['gps-camera'];
                    if (gpsComp && gpsComp.currentPosition) {
                        updateDisplay(gpsComp.currentPosition);
                    }
                }, 1000);
            });

            // Также обновляем время каждую секунду (для неподвижного состояния)
            setInterval(() => {
                const camera = document.getElementById('camera');
                if (camera) {
                    const gpsComp = camera.components && camera.components['gps-camera'];
                    if (gpsComp && gpsComp.currentPosition) {
                        // Если координаты есть, обновляем время (они не меняются)
                        timestampEl.textContent = formatTime(new Date());
                    } else {
                        // Если координат всё ещё нет, показываем ожидание
                        if (latEl.textContent === '--' || latEl.textContent === 'ошибка') {
                            timestampEl.innerHTML = '<span class="warning">ожидание GPS...</span>';
                        }
                    }
                }
            }, 1000);
        })();
    </script>

    <script>
if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
        (pos) => {
            console.log('GPS напрямую:', pos.coords);
            document.getElementById('debug-gps').innerHTML = `
                Прямой GPS: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}<br>
                Точность: ${pos.coords.accuracy} м
            `;
        },
        (err) => {
            console.warn('Ошибка GPS:', err);
            document.getElementById('debug-gps').innerHTML = `Ошибка GPS: ${err.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
} else {
    document.getElementById('debug-gps').innerHTML = 'Geolocation не поддерживается';
}
</script>
<div id="debug-gps" style="position: absolute; top: 80px; left: 10px; background: black; color: lime; padding: 5px; z-index: 1001;"></div>
</body>
</html>
