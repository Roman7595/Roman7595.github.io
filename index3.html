<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR.js с GPS координатами</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="info">
        Куб – 1 м на север<br>
        Сфера – 1 м на восток
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">
        <a-camera gps-camera="gpsMinDistance: 1;"></a-camera>

        <a-box
            material="color: cyan; transparent: false;"
            gps-projected-entity="distance: 1; heading: 0;"
            scale="1 1 1"
            >  
        </a-box>

        <a-sphere
            material="color: red;"
            gps-projected-entity="distance: 2; heading: 90;"
            radius="0.5"
           >
        </a-sphere>

        <a-cylinder
            material="color: green;"
            gps-projected-entity="distance: 1; heading: 225;"
            radius="0.5"
            height="1.5"
            position="0 0.75 -5">
        </a-cylinder>
    </a-scene>
</body>
</html>
